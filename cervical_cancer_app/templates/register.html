{% extends "base.html" %}
{% block title %}Register · CervixGuard AI{% endblock %}

{% block head %}
<style>
  .auth-wrap {
    position:relative; z-index:1;
    min-height:calc(100vh - 120px);
    display:flex; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }
  .auth-card {
    width:100%; max-width:420px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px; padding:2.5rem 2rem;
    backdrop-filter:blur(12px);
  }
  .auth-card h2 {
    font-size:1.4rem; font-weight:700;
    margin-bottom:.3rem; color:#fff;
  }
  .auth-card p {
    font-size:.8rem; color:rgba(255,255,255,.4);
    margin-bottom:1.8rem;
  }
  .field { margin-bottom:1.1rem }
  .field label {
    display:block; font-size:.75rem; font-weight:500;
    color:rgba(255,255,255,.5); margin-bottom:.4rem;
  }
  .field input {
    width:100%; padding:.7rem 1rem;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px; color:#fff;
    font-size:.85rem; font-family:Inter,sans-serif;
    outline:none; transition:border-color .2s;
  }
  .field input:focus { border-color:rgba(124,58,237,.6) }
  .field input::placeholder { color:rgba(255,255,255,.2) }
  .btn-primary {
    width:100%; padding:.8rem;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    border:none; border-radius:10px;
    color:#fff; font-size:.9rem; font-weight:600;
    cursor:pointer; font-family:Inter,sans-serif;
    transition:opacity .2s; margin-top:.4rem;
  }
  .btn-primary:hover { opacity:.88 }
  .auth-footer {
    text-align:center; margin-top:1.4rem;
    font-size:.78rem; color:rgba(255,255,255,.35);
  }
  .auth-footer a {
    color:#a78bfa; text-decoration:none; font-weight:500;
  }
  .auth-footer a:hover { text-decoration:underline }
  .auth-icon {
    width:48px; height:48px; border-radius:13px;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; margin-bottom:1.2rem;
  }
  .hint {
    font-size:.72rem; color:rgba(255,255,255,.25);
    margin-top:.3rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon">🎗️</div>
    <h2>Create account</h2>
    <p>Start tracking cervical cancer risk assessments</p>

    <form method="POST" action="/register">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Dr. Sharma" required autofocus/>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required/>
        <div class="hint">Minimum 6 characters</div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
